name: Auto-assign Copilot

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  assign-copilot:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.issue.title, '[L]') }}
    steps:
      - name: Trigger Copilot coding agent on new issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '@copilot Please work on this issue. Scope and acceptance criteria are defined above; follow AGENTS.md conventions and open a PR when done.'
            });

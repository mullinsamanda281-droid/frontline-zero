<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FRONTLINE ZERO</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="hud">
        <div id="fps-counter">-- FPS</div>
        <div id="stamina-bar"><div id="stamina-fill"></div></div>
        <div id="crosshair">+</div>
        <div id="hitmarker"></div>
        <div id="scope-overlay">
          <div id="scope-ring"></div>
          <div id="scope-cross-h"></div>
          <div id="scope-cross-v"></div>
        </div>
        <div id="bottom-left">
          <div id="health-bar"><div id="health-fill"></div></div>
          <div id="weapon-name">--</div>
          <div id="ammo-count">-- / --</div>
        </div>
        <div id="score">TARGETS DOWN: 0</div>
      </div>
      <div id="overlay">
        <h1>FRONTLINE ZERO</h1>
        <p>PLAYABLE TEST — 01</p>
        <div id="controls">
          <div><span>WASD</span> move</div>
          <div><span>MOUSE</span> look</div>
          <div><span>LMB</span> fire</div>
          <div><span>R</span> reload</div>
          <div><span>1–6</span> switch weapon</div>
          <div><span>SHIFT</span> sprint</div>
          <div><span>SPACE</span> jump / bunny-hop on landing</div>
          <div><span>C</span> slide (sprint + C)</div>
          <div><span>Q / E</span> lean left / right</div>
          <div><span>Z</span> dive-to-prone</div>
        </div>
        <button id="start">CLICK TO DEPLOY</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
